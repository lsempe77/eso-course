project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - tiers/**/*.qmd

website:
  title: "Technology-Enabled Evidence Synthesis"
  description: "A technology-enabled way of working for the 3ie Evidence Synthesis Office."
  site-url: "https://sempe.dev/eso-course"
  page-navigation: true
  reader-mode: true
  navbar:
    background: "#16508a"
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: tiers/tier0/index.qmd
        text: Tier 0
      - href: tiers/tier1/index.qmd
        text: Tier 1
      - href: tiers/tier2/index.qmd
        text: Tier 2
      - href: tiers/tier3/index.qmd
        text: Tier 3
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - text: "Home"
        href: index.qmd
      - section: "Tier 0 — Orientation & setup"
        href: tiers/tier0/index.qmd
        contents:
          - tiers/tier0/install-and-accounts.qmd
          - tiers/tier0/meet-the-agent.qmd
          - tiers/tier0/01-first-versioned-file.qmd
      - href: tiers/tier1/index.qmd
        text: "Tier 1 — Foundations"
      - href: tiers/tier2/index.qmd
        text: "Tier 2 — Synthesis lifecycle"
      - href: tiers/tier3/index.qmd
        text: "Tier 3 — Advanced"
  page-footer:
    left: "3ie Evidence Synthesis Office"
    right: "Built with Quarto · access restricted to 3ie"

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
